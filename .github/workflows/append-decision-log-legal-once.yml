name: One-time append legal decisions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/trigger-append-legal-decisions'

permissions:
  contents: write

jobs:
  append:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Append LEG1-LEG5
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('docs/Master Plan/09_QA_DECISION_LOG.md')
          payload = Path('.github/decision-log-legal-append.md').read_text(encoding='utf-8')
          text = target.read_text(encoding='utf-8')
          marker = '## 24. Pravni i podatkovni okvir — dodatne odluke'
          if marker not in text:
              target.write_text(text.rstrip() + payload.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'docs/Master Plan/09_QA_DECISION_LOG.md'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'docs: record LEG1-LEG5 decisions'
            git push origin HEAD:${{ github.head_ref }}
          fi
