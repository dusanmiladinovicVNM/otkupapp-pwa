name: One-time update ON4 Decision Log

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/trigger-update-on4'

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Record ON4 and close open item
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/Master Plan/09_QA_DECISION_LOG.md')
          text = path.read_text(encoding='utf-8')

          on3 = ('ON3. **Zajednički produkcijski sign-off.** AgriX potvrđuje tehničku spremnost, '
                 'uspešnost uvoza i ključne tokove. Odgovorna osoba klijenta potvrđuje poslovnu '
                 'tačnost podataka, podešavanja i spremnost zaposlenih. Produkcijski rad počinje '
                 'tek nakon obe potvrde.')
          on4 = ('ON4. **Period pojačane podrške nakon puštanja.** Pojačana podrška neposredno nakon '
                 'produkcijskog početka nije automatski deo standardnog onboardinga; obezbeđuje se '
                 'samo kada je posebno ugovorena.')

          if on4 not in text:
              if on3 not in text:
                  raise SystemExit('ON3 anchor not found')
              text = text.replace(on3, on3 + '\n' + on4, 1)

          open_section = ('\n---\n\n## 23. Otvoreno posle ove dopune\n\n'
                          '- Precizan standardni period pojačane podrške neposredno posle '
                          'produkcijskog početka (ON4) nije još odlučen.\n')
          if open_section in text:
              text = text.replace(open_section, '\n', 1)
          else:
              stale = ('- Precizan standardni period pojačane podrške neposredno posle '
                       'produkcijskog početka (ON4) nije još odlučen.\n')
              text = text.replace(stale, '', 1)

          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit ON4 update to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'docs/Master Plan/09_QA_DECISION_LOG.md'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'docs: record ON4 support decision'
            git push origin HEAD:${{ github.head_ref }}
          fi
